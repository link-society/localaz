# localaz development stack — the single container users run.
#
#   task docker:up
#   # or, directly:
#   docker compose -f docker/docker-compose.dev.yml up --build
#
# The Blob endpoint is then available at http://127.0.0.1:10000/devstoreaccount1
services:
  localaz:
    build:
      context: ..
      dockerfile: docker/localaz.dockerfile
    image: localaz:dev
    container_name: localaz
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
      - "10003:10003"
      - "10004:10004"
      - "10005:10005"
      - "10006:10006"
      - "10007:10007"
      - "5672:5672"
    volumes:
      - localaz-data:/data
    environment:
      LOCALAZ_BLOB_ADDR: ":10000"
      LOCALAZ_QUEUE_ADDR: ":10001"
      LOCALAZ_TABLE_ADDR: ":10002"
      LOCALAZ_EVENTGRID_ADDR: ":10003"
      LOCALAZ_WEBPUBSUB_ADDR: ":10004"
      LOCALAZ_MONITOR_ADDR: ":10005"
      LOCALAZ_AAD_ADDR: ":10006"
      LOCALAZ_ARM_ADDR: ":10007"
      LOCALAZ_SERVICEBUS_ADDR: ":5672"
      LOCALAZ_DATA_DIR: "/data"

volumes:
  localaz-data:
